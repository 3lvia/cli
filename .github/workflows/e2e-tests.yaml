name: End-to-End Tests

on:
  pull_request:
    branches: [trunk]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'install.sh'

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command:
          - build
        # DEPRECATED
        # - create
          - github-actions
          - init
          - scan
          - upgrade
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: 'go.sum'
          go-version-file: 'go.mod'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: 'ghcr.io'
          username: ${{ github.actor }}
          password: ${{ github.token }}
          
      - name: Install CLI from source
        run: make install

      - name: Setup Python
        if: ${{ matrix.command == 'create' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0

      - name: Install pipx and cookiecutter
        if: ${{ matrix.command == 'create' }}
        run: |
          sudo apt update
          sudo apt install -y pipx
          pipx install cookiecutter

      - name: Install uv
        if: ${{ matrix.command == 'create' }}
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Trivy
        shell: bash
        run: |
          # Install Trivy, not using Elvia runner
          sudo apt-get install wget gnupg -y --no-install-recommends
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: 'Run tests for ${{ matrix.command }} command'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          "./tests/$COMMAND/run_tests.sh"
        env:
          # Increases rate-limit of when downloading 3lv from GitHub in tests for '3lv upgrade'.
          GITHUB_TOKEN: ${{ github.token }}
          COMMAND: ${{ matrix.command }}
