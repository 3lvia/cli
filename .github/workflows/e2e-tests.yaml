name: End-to-End Tests

on:
  pull_request:
    branches: [trunk]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'install.sh'

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: elvia-runner
    strategy:
      matrix:
        command:
          - build
        # DEPRECATED
        # - create
          - github-actions
          - init
          - scan
          - upgrade
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: 'go.sum'
          go-version-file: 'go.mod'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: 'ghcr.io'
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install CLI from source
        run: make install

      - name: Setup Python
        if: ${{ matrix.command == 'create' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0

      - name: Install pipx and cookiecutter
        if: ${{ matrix.command == 'create' }}
        run: |
          sudo apt update
          sudo apt install -y pipx
          pipx install cookiecutter

      - name: Install uv
        if: ${{ matrix.command == 'create' }}
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 'Run tests for ${{ matrix.command }} command'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          "./tests/$COMMAND/run_tests.sh"
        env:
          # Increases rate-limit of when downloading 3lv from GitHub in tests for '3lv upgrade'.
          GITHUB_TOKEN: ${{ github.token }}
          COMMAND: ${{ matrix.command }}
