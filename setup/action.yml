name: 'Setup 3lv'
description: 'Sets up the Elvia CLI on your GitHub Actions runner.'
inputs:
  version:
    description: 'The version of 3lv to install. Specify `git` to build and install the latest version from the default branch.'
    required: false
    default: 'latest'
  install-directory:
    description: 'The directory to install the 3lv CLI to.'
    required: false
  install-as-root:
    description: 'Whether to run the `install` command as root. This is necessary if the `install-directory` is a system directory like `/usr/local/bin`. Defaults to `false`.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup the 3lv CLI
      shell: bash
      run: |
        # Setup the 3lv CLI
        if ! command -v gh &> /dev/null; then
          echo "The GitHub CLI is required to install the 3lv CLI."
          exit 1
        fi

        if [[ "$VERSION" == 'latest' ]]; then
          version=$(gh release list -R 3lvia/cli --json name,isLatest -q '.[] | select(.isLatest == true) | .name' | cut -c 2-)
        else
          version="$VERSION"
        fi

        if ! gh release download -R "$CLI_REPOSITORY" "v$version" --pattern "3lv-*linux-amd64.tar.gz*"; then
          echo "Failed to find release for version $version, will try to find a matching branch and build from source."

          cd "$(mktemp -d)"
          if ! git clone -b "$version" "https://github.com/$CLI_REPOSITORY.git" .; then
            echo "Failed to find branch $version."
            exit 1
          fi

          echo "git-$version-$(git rev-parse --short HEAD)" > VERSION
          make install
          3lv --version
          exit 0
        fi

        md5sum -c --quiet 3lv-*linux-amd64.tar.gz.md5
        tar -xzf 3lv-*linux-amd64.tar.gz

        if [[ "$INSTALL_AS_ROOT" == 'true' ]]; then
          echo "Running install command as root since INSTALL_AS_ROOT is set to true."
          sudo install -Dm755 -t "${{ env.INSTALL_DIRECTORY }}" 3lv # use GHA env and not bash native since we want $HOME to be expanded in the env variable
        else
          install -Dm755 -t "${{ env.INSTALL_DIRECTORY }}" 3lv # same here
        fi

        3lv --version
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIRECTORY: ${{ inputs.install-directory == '' && '$HOME/.local/bin' || inputs.install-directory }}
        INSTALL_AS_ROOT: ${{ inputs.install-as-root }}
        GH_TOKEN: ${{ github.token }}
        CLI_REPOSITORY: '3lvia/cli'
